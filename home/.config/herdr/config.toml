# Herdr configuration
# Managed in ~/.dotfiles and stowed to ~/.config/herdr/config.toml
# Terminal-native workspace/tab/pane manager.

onboarding = false

[terminal]
default_shell = "fish"
shell_mode = "auto"
new_cwd = "follow"

[theme]
name = "catppuccin"

[update]
channel = "stable"

[keys]
# Ghostty sends these as escape sequences for Cmd keys (see ghostty/config)
# Cmd+1..9: Ghostty sends \x1b1..\x1b9 which Herdr reads as alt+1..9.
# These switch to a specific tab by number.
switch_tab = "alt+1..9"

# Cmd+[/]: Ghostty sends \x1b,/\x1b. which Herdr reads as alt+,/alt+.
# These cycle through panes previous/next.
cycle_pane_previous = "alt+,"
cycle_pane_next = "alt+."

[[keys.command]]
key = "alt+n"
type = "shell"
description = "Split vertical + label"
command = "~/.config/herdr/scripts/split-pane.sh right"

[[keys.command]]
key = "alt+d"
type = "shell"
description = "Split horizontal + label"
command = "~/.config/herdr/scripts/split-pane.sh down"

# Cmd+Shift+N = new tab with 2 panes (side-by-side)
[[keys.command]]
key = "alt+shift+n"
type = "shell"
description = "New tab with 2 panes"
command = "~/.config/herdr/scripts/new-tab-two-panes.sh"

# Cmd+K = clear focused pane.
# Ghostty maps cmd+k to the \x0b byte (Ctrl-K). In Zellij that byte hits
# `Ctrl k { Clear; }`. Herdr has no native clear action, so this custom
# command intercepts ctrl+k and sends ctrl+l (fish's clear-screen binding)
# to the UI-focused pane.
[[keys.command]]
key = "ctrl+k"
type = "shell"
description = "Clear focused pane (cmd+k)"
command = "~/.config/herdr/scripts/clear-pane.sh"

# Label all panes and tabs with their IDs (refresh)
[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-pane-labels.label-all"
description = "Label all panes and tabs with IDs"

[ui]
accent = "#c6a0f6"
agent_panel_sort = "spaces"
confirm_close = false
mouse_capture = true
mouse_scroll_lines = 3
prompt_new_tab_name = false
prompt_new_workspace_name = true
right_click_passthrough_modifier = "ctrl"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sidebar.spaces]
row_gap = 1

[ui.sidebar.agents]
row_gap = 1

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
allow_nested = false
kitty_graphics = true
pane_history = true

[advanced]
scrollback_limit_bytes = 52428800
